<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <title>NINETY-NINE — room preview</title>
  <link rel="stylesheet" href="../style.css" />
  <style>
    #picker { position: fixed; top: 0.75rem; left: 0.75rem; z-index: 20; font-family: 'Courier New', monospace; font-size: 0.75rem; }
    #picker select, #picker button { font-family: inherit; background: #111; color: #eee; border: 1px solid #666; padding: 0.3rem; }
  </style>
</head>
<body>
  <div id="stage"><div id="scene-layer"></div><div id="walk-layer" hidden></div></div>
  <div id="picker"><select id="room"></select> <select id="shot"></select> <button id="go" type="button">PLAY SHOT</button> <button id="walkbtn" type="button">WALK</button></div>
  <script type="module">
    // Dev-only: play any shot of any room from data/rooms.json, or walk it,
    // without playing to it. Same module the game uses (src/stage/), so
    // what you see here is what the scene shows. Query: ?room=S4_C&shot=loop
    // jumps straight in; ?room=S5_H&walk=1 walks it.
    import { createStage } from '../src/stage/stage.js';
    const rooms = await fetch('../data/rooms.json').then((r) => r.json());
    const select = document.getElementById('room');
    const shotSel = document.getElementById('shot');
    for (const key of Object.keys(rooms.rooms)) select.append(new Option(key, key));
    const stage = createStage(document.getElementById('scene-layer'), { rooms, overlay: document.getElementById('walk-layer') });
    function fillShots() {
      const rec = stage.record(select.value);
      shotSel.replaceChildren();
      for (const name of Object.keys(rec.shots || {})) shotSel.append(new Option(name, name));
    }
    select.addEventListener('change', fillShots);
    fillShots();
    async function play(key, shot) {
      select.value = key; fillShots(); if (shot) shotSel.value = shot;
      stage.setPlayerActive(false);
      await stage.preview(key);
      await stage.playShot(key, shotSel.value);
    }
    async function walk(key) {
      select.value = key;
      document.getElementById('walk-layer').hidden = false;
      await stage.walk(key);
    }
    document.getElementById('go').addEventListener('click', () => play(select.value));
    document.getElementById('walkbtn').addEventListener('click', () => walk(select.value));
    window.__ROOMS__ = { stage, play, walk, rooms };
    const q = new URLSearchParams(location.search);
    const room = q.get('room');
    if (room && rooms.rooms[room]) { if (q.get('walk')) walk(room); else play(room, q.get('shot') || 'loop'); }
  </script>
</body>
</html>
